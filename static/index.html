<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wavtotube — 초고속 오디오 변환 및 AI 스마트 파일명 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #121316;
      --glass-surface: rgba(45, 47, 54, 0.45);
      --glass-border: rgba(255, 255, 255, 0.12);
    }
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-canvas);
      background-image: 
        radial-gradient(at 15% 20%, rgba(30, 34, 45, 0.8) 0px, transparent 50%),
        radial-gradient(at 85% 75%, rgba(20, 24, 33, 0.8) 0px, transparent 50%);
      color: #F5F5F7;
      min-height: 100vh;
      overflow-x: hidden;
      letter-spacing: -0.02em;
    }
    .vision-glass {
      background: var(--glass-surface);
      backdrop-filter: blur(50px) saturate(180%);
      -webkit-backdrop-filter: blur(50px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6), inset 0 1px 1px 0 rgba(255, 255, 255, 0.18);
    }
    .vision-control {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 0.5px rgba(255, 255, 255, 0.15);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .vision-control:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .apple-spring {
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .gradient-hero-text {
      background: linear-gradient(135deg, #4ade80 0%, #38bdf8 50%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    @keyframes eq-wave {
      0%, 100% { height: 4px; }
      50% { height: 22px; }
    }
    .eq-bar { animation: eq-wave 1s ease-in-out infinite; }
  </style>
</head>
<body class="flex flex-col justify-between selection:bg-blue-500/30 selection:text-white">

  <header class="w-full pt-6 px-6">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-2xl vision-control flex items-center justify-center">
          <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M12 3v18M7 8v8M17 8v8M2 12v0M22 12v0" />
          </svg>
        </div>
        <span class="text-base font-bold tracking-tight text-white/95">Wavtotube</span>
      </div>
      <div>
        <span class="text-xs font-semibold text-neutral-300 vision-control px-3.5 py-1.5 rounded-full">
          AI 음악 분석 & 스마트 파일명 엔진
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-12 w-full flex-1 flex flex-col justify-center items-center">
    
    <div class="text-center mb-10 space-y-3">
      <h1 class="text-4xl sm:text-5xl md:text-6xl font-extrabold tracking-tight text-white leading-[1.15]">
        모든 음악을<br />
        <span class="gradient-hero-text">더 빠르고 완벽하게.</span>
      </h1>
      <p class="text-sm sm:text-base text-neutral-400 font-medium max-w-md mx-auto pt-2 leading-relaxed">
        유튜브와 인스타그램 링크를 10초 안에 초고속 변환하고,<br />
        AI로 곡 제목, 아티스트, BPM, 조성을 정리하여 완벽한 파일명으로 저장하세요.
      </p>
    </div>

    <div class="w-full vision-glass rounded-[2rem] p-6 sm:p-8 apple-spring">
      <form id="convert-form" class="space-y-6">
        <div class="relative flex items-center">
          <input
            type="url"
            id="url"
            required
            placeholder="유튜브 또는 인스타그램 링크를 붙여넣으세요..."
            class="w-full vision-control rounded-2xl px-5 py-4 text-sm sm:text-base text-white placeholder-neutral-500 focus:outline-none focus:border-white/30 focus:bg-white/[0.09] pr-28 apple-spring"
          />
          <button
            type="button"
            id="paste-btn"
            class="absolute right-3 vision-control hover:text-white text-neutral-400 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center space-x-1.5"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
            </svg>
            <span>붙여넣기</span>
          </button>
        </div>

        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-1">
          <div class="vision-control p-1 rounded-2xl inline-flex space-x-1 w-full sm:w-auto justify-center">
            <label class="cursor-pointer flex-1 sm:flex-none">
              <input type="radio" name="format" value="mp3" checked class="peer sr-only" />
              <div class="px-5 py-2 rounded-xl text-xs font-semibold text-neutral-400 peer-checked:text-white peer-checked:bg-white/15 peer-checked:shadow-sm apple-spring text-center">
                MP3 (320kbps)
              </div>
            </label>
            <label class="cursor-pointer flex-1 sm:flex-none">
              <input type="radio" name="format" value="wav" class="peer sr-only" />
              <div class="px-5 py-2 rounded-xl text-xs font-semibold text-neutral-400 peer-checked:text-white peer-checked:bg-white/15 peer-checked:shadow-sm apple-spring text-center">
                WAV (무손실)
              </div>
            </label>
          </div>

          <button
            type="submit"
            id="submit-btn"
            class="w-full sm:w-auto px-7 py-3 rounded-2xl font-semibold text-sm text-white bg-[#0A84FF] hover:bg-[#0071E3] active:scale-[0.98] shadow-lg shadow-blue-500/25 apple-spring flex items-center justify-center space-x-2"
          >
            <span id="btn-text">변환 및 분석</span>
            <svg id="btn-arrow" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
            <svg id="btn-spinner" class="animate-spin h-4 w-4 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
          </button>
        </div>
      </form>
    </div>

    <!-- Playlist Selection Dialog -->
    <div id="playlist-modal" class="hidden mt-6 w-full vision-glass rounded-[2rem] p-6 text-center apple-spring border border-blue-500/30">
      <div class="w-10 h-10 rounded-2xl bg-blue-500/20 text-[#0A84FF] mx-auto flex items-center justify-center mb-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
        </svg>
      </div>
      <h3 class="text-base font-bold text-white mb-1">플레이리스트가 감지되었습니다</h3>
      <p id="playlist-msg" class="text-xs text-neutral-400 mb-5">여러 영상이 포함되어 있습니다. 어떻게 다운로드할까요?</p>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-w-md mx-auto">
        <button id="choice-single-btn" class="vision-control hover:bg-white/15 px-4 py-3 rounded-2xl text-xs font-bold text-white border border-white/20 apple-spring">
          👉 이 곡만 단독 다운로드
        </button>
        <button id="choice-playlist-btn" class="bg-[#0A84FF] hover:bg-[#0071E3] px-4 py-3 rounded-2xl text-xs font-bold text-white shadow-lg shadow-blue-500/30 apple-spring">
          📚 전체 플레이리스트 다운로드 (최대 5곡)
        </button>
      </div>
    </div>

    <!-- Status & Estimated Time Capsule -->
    <div id="status-card" class="hidden mt-6 text-center apple-spring opacity-0">
      <div class="inline-flex flex-col sm:flex-row items-center gap-2 sm:gap-4 vision-glass px-6 py-3 rounded-2xl sm:rounded-full">
        <div class="flex items-center space-x-3">
          <div class="flex items-center space-x-1 h-5">
            <span class="w-1 bg-[#0A84FF] rounded-full eq-bar" style="animation-delay: 0.1s"></span>
            <span class="w-1 bg-[#38bdf8] rounded-full eq-bar" style="animation-delay: 0.3s"></span>
            <span class="w-1 bg-[#4ade80] rounded-full eq-bar" style="animation-delay: 0.2s"></span>
            <span class="w-1 bg-[#0A84FF] rounded-full eq-bar" style="animation-delay: 0.4s"></span>
          </div>
          <span id="status-text" class="text-xs text-neutral-200 font-medium">초고속 오디오 추출 및 분석 중...</span>
        </div>
        
        <div class="flex items-center space-x-2 text-[11px] font-semibold text-neutral-400 border-t sm:border-t-0 sm:border-l border-white/10 pt-1.5 sm:pt-0 sm:pl-3">
          <span>진행 시간: <strong id="elapsed-time-text" class="text-white">0s</strong></span>
          <span class="text-neutral-600">&bull;</span>
          <span class="text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-md border border-emerald-500/20">
            예상 완료: <strong id="estimated-time-text">약 5~10초</strong>
          </span>
        </div>
      </div>
    </div>

    <!-- Error Toast -->
    <div id="error-card" class="hidden mt-6 w-full vision-glass rounded-[2rem] p-6 text-left apple-spring border border-red-500/30">
      <div class="flex items-start space-x-3">
        <div class="w-8 h-8 rounded-xl bg-red-500/20 text-red-400 flex items-center justify-center flex-shrink-0 mt-0.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
        </div>
        <div class="flex-1 space-y-2">
          <h4 id="error-title" class="text-sm font-bold text-red-300">오류 발생</h4>
          <p id="error-msg" class="text-xs text-neutral-300"></p>
          <div id="error-guide-box" class="pt-2 hidden">
            <span class="text-[11px] font-bold text-white/60 block mb-1">해결 방법 안내:</span>
            <ul id="error-guide-list" class="text-xs text-neutral-400 space-y-1 list-disc list-inside bg-black/30 p-3 rounded-xl border border-white/5"></ul>
          </div>
        </div>
      </div>
    </div>

    <!-- Result Cards List Container -->
    <div id="results-container" class="w-full space-y-6 mt-8"></div>

  </main>

  <footer class="w-full py-8 text-center text-xs text-neutral-500">
    Wavtotube &middot; 초고속 음원 변환 및 AI 스마트 파일명 관리 시스템
  </footer>

  <script>
    const form = document.getElementById('convert-form');
    const urlInput = document.getElementById('url');
    const pasteBtn = document.getElementById('paste-btn');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnArrow = document.getElementById('btn-arrow');
    const btnSpinner = document.getElementById('btn-spinner');

    const playlistModal = document.getElementById('playlist-modal');
    const playlistMsg = document.getElementById('playlist-msg');
    const choiceSingleBtn = document.getElementById('choice-single-btn');
    const choicePlaylistBtn = document.getElementById('choice-playlist-btn');

    const statusCard = document.getElementById('status-card');
    const statusText = document.getElementById('status-text');
    const elapsedTimeText = document.getElementById('elapsed-time-text');
    const estimatedTimeText = document.getElementById('estimated-time-text');

    const errorCard = document.getElementById('error-card');
    const errorTitle = document.getElementById('error-title');
    const errorMsg = document.getElementById('error-msg');
    const errorGuideBox = document.getElementById('error-guide-box');
    const errorGuideList = document.getElementById('error-guide-list');
    const resultsContainer = document.getElementById('results-container');

    let timerInterval = null;
    let secondsElapsed = 0;

    function startTimer(mode) {
      secondsElapsed = 0;
      elapsedTimeText.textContent = "0s";
      estimatedTimeText.textContent = mode === "playlist" ? "약 15~25초" : "약 6~10초";

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        elapsedTimeText.textContent = `${secondsElapsed}s`;
        if (mode === "single") {
          if (secondsElapsed > 7) estimatedTimeText.textContent = "마무리 분석 중...";
        } else {
          if (secondsElapsed > 18) estimatedTimeText.textContent = "마무리 작업 중...";
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    function translateKeyToKorean(keyStr) {
      if (!keyStr) return '--';
      return keyStr.replace('Major', '장조 (Major)').replace('Minor', '단조 (Minor)');
    }

    pasteBtn.addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          urlInput.value = text;
          urlInput.focus();
        }
      } catch (err) {
        urlInput.focus();
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = urlInput.value.trim();

      errorCard.classList.add('hidden');
      playlistModal.classList.add('hidden');
      resultsContainer.innerHTML = '';

      submitBtn.disabled = true;
      btnText.textContent = "링크 검사 중...";
      btnArrow.classList.add('hidden');
      btnSpinner.classList.remove('hidden');

      try {
        const checkRes = await fetch('/api/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const checkText = await checkRes.text();
        let checkData = {};
        try { checkData = JSON.parse(checkText); } catch (_) {}

        if (checkRes.ok && checkData.success && checkData.data && checkData.data.is_playlist) {
          playlistMsg.textContent = `이 링크는 '${checkData.data.title}' 플레이리스트(총 ${checkData.data.count}곡)입니다. 어떤 방식으로 변환할까요?`;
          playlistModal.classList.remove('hidden');
          submitBtn.disabled = false;
          btnText.textContent = "변환 및 분석";
          btnArrow.classList.remove('hidden');
          btnSpinner.classList.add('hidden');
        } else {
          startConversion(url, "single");
        }
      } catch (err) {
        startConversion(url, "single");
      }
    });

    choiceSingleBtn.addEventListener('click', () => {
      playlistModal.classList.add('hidden');
      startConversion(urlInput.value.trim(), "single");
    });

    choicePlaylistBtn.addEventListener('click', () => {
      playlistModal.classList.add('hidden');
      startConversion(urlInput.value.trim(), "playlist");
    });

    async function startConversion(url, mode) {
      const format = document.querySelector('input[name="format"]:checked').value;

      errorCard.classList.add('hidden');
      statusCard.classList.remove('hidden');
      statusText.textContent = mode === "playlist" ? "플레이리스트 오디오 일괄 추출 중..." : "오디오 추출 및 초고속 BPM/Key 분석 중...";
      setTimeout(() => statusCard.classList.remove('opacity-0'), 20);

      startTimer(mode);

      submitBtn.disabled = true;
      btnText.textContent = "초고속 처리 중...";
      btnArrow.classList.add('hidden');
      btnSpinner.classList.remove('hidden');

      try {
        const res = await fetch('/api/convert', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, format, mode })
        });

        const resText = await res.text();
        let resData = null;
        try {
          resData = JSON.parse(resText);
        } catch (jsonErr) {
          const preview = resText ? resText.slice(0, 150) : "서버에서 빈 응답이 반환되었습니다.";
          showError(`서버 응답 오류: ${preview}`, [
            "VS Code 터미널 로그를 확인해주세요."
          ]);
          return;
        }

        if (!res.ok || !resData.success) {
          const detailMsg = resData.detail || '변환 처리 중 오류가 발생했습니다.';
          const steps = resData.action_steps || [];
          showError(detailMsg, steps);
          return;
        }

        const tracks = resData.data || [];
        const timings = resData.timings || {};
        const totalSec = timings.total || secondsElapsed;

        resultsContainer.innerHTML = '';
        tracks.forEach((t, idx) => {
          renderTrackCard(t, idx, totalSec, resData.under_10s);
        });

      } catch (err) {
        showError(err.message || '요청 처리 실패', []);
      } finally {
        stopTimer();
        statusCard.classList.add('hidden');
        submitBtn.disabled = false;
        btnText.textContent = "변환 및 분석";
        btnArrow.classList.remove('hidden');
        btnSpinner.classList.add('hidden');
      }
    }

    function renderTrackCard(track, idx, totalSec, isUnder10s) {
      const min = Math.floor(track.duration / 60);
      const sec = Math.floor(track.duration % 60).toString().padStart(2, '0');
      const thumbHtml = track.thumbnail ? `<img src="${track.thumbnail}" class="w-full h-full object-cover">` : `<div class="text-neutral-500 text-xs">오디오</div>`;
      const under10sBadge = isUnder10s 
        ? `<span class="text-[10px] font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">⚡ ${totalSec}초 만에 완료</span>` 
        : `<span class="text-[10px] text-neutral-400 bg-white/5 px-2 py-0.5 rounded-full border border-white/10">⏱ ${totalSec}s</span>`;

      const card = document.createElement('div');
      card.id = `track-card-${idx}`;
      card.className = "vision-glass rounded-[2rem] p-6 sm:p-7 shadow-2xl apple-spring space-y-5";
      card.innerHTML = `
        <div class="flex flex-col sm:flex-row items-center gap-6">
          <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl overflow-hidden bg-black/40 border border-white/10 flex-shrink-0 flex items-center justify-center shadow-md">
            ${thumbHtml}
          </div>
          <div class="flex-1 w-full space-y-3 text-center sm:text-left">
            <div>
              <div class="flex items-center justify-center sm:justify-start space-x-2 mb-1.5">
                <span class="text-[11px] font-bold text-white px-2 py-0.5 rounded-md bg-white/10 uppercase tracking-wider">${track.format.toUpperCase()}</span>
                <span class="text-xs text-neutral-400 font-medium">${min}:${sec}</span>
                ${under10sBadge}
              </div>
              <h3 id="track-title-display-${idx}" class="text-lg font-bold text-white tracking-tight line-clamp-1">${track.title}</h3>
              <p id="track-artist-display-${idx}" class="text-xs text-neutral-400 pt-0.5">${track.artist || '알 수 없음'}</p>
            </div>
            <div class="grid grid-cols-2 gap-3 pt-1">
              <div class="vision-control rounded-2xl p-2.5 flex flex-col items-center justify-center">
                <span class="text-[10px] uppercase font-bold tracking-wider text-neutral-400">템포 (BPM)</span>
                <span id="track-bpm-display-${idx}" class="text-xl font-extrabold text-white tracking-tight mt-0.5">${track.bpm}</span>
              </div>
              <div class="vision-control rounded-2xl p-2.5 flex flex-col items-center justify-center">
                <span class="text-[10px] uppercase font-bold tracking-wider text-neutral-400">조성 (Key)</span>
                <span id="track-key-display-${idx}" class="text-base font-extrabold text-white tracking-tight mt-0.5">${translateKeyToKorean(track.key)}</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 3 Save Option Buttons -->
        <div class="pt-2 border-t border-white/10 space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-neutral-300">파일 저장 방식 선택</span>
            <span id="active-filename-badge-${idx}" class="text-[11px] text-neutral-400 font-mono truncate max-w-xs">
              ${track.file_name}
            </span>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
            <a
              id="opt-a-btn-${idx}"
              href="${track.download_url}"
              download="${track.file_name}"
              class="vision-control hover:bg-white/15 px-3 py-3 rounded-xl text-xs font-semibold text-white/90 border border-white/15 flex flex-col items-center justify-center text-center apple-spring group"
            >
              <span class="font-bold">원본 파일명 그대로 저장</span>
              <span class="text-[10px] text-neutral-400 group-hover:text-neutral-300 mt-0.5">기존 이름 유지</span>
            </a>

            <button
              id="opt-b-btn-${idx}"
              type="button"
              class="bg-[#0A84FF] hover:bg-[#0071E3] px-3 py-3 rounded-xl text-xs font-semibold text-white shadow-lg shadow-blue-500/25 flex flex-col items-center justify-center text-center apple-spring"
            >
              <span class="font-bold">✨ AI가 정리해드릴게요!</span>
              <span class="text-[10px] text-blue-100/80 mt-0.5">곡명·아티스트·BPM·조성 반영</span>
            </button>

            <button
              id="opt-c-btn-${idx}"
              type="button"
              class="vision-control hover:bg-white/15 px-3 py-3 rounded-xl text-xs font-semibold text-white/90 border border-white/15 flex flex-col items-center justify-center text-center apple-spring group"
            >
              <span class="font-bold">다른 이름으로 저장...</span>
              <span class="text-[10px] text-neutral-400 group-hover:text-neutral-300 mt-0.5">사용자 직접 지정</span>
            </button>
          </div>
        </div>

        <!-- AI Editor Preview Panel -->
        <div id="ai-panel-${idx}" class="hidden vision-control rounded-2xl p-5 border border-blue-500/30 space-y-4 apple-spring">
          <div class="flex items-center justify-between border-b border-white/10 pb-3">
            <div>
              <h4 class="text-xs font-bold text-white flex items-center space-x-1.5">
                <span class="w-2 h-2 rounded-full bg-blue-400"></span>
                <span>AI 음악 분석 결과 및 파일명 미리보기</span>
              </h4>
              <p class="text-[10px] text-neutral-400 mt-0.5">분석된 메타데이터를 직접 수정한 뒤 파일명을 적용할 수 있습니다.</p>
            </div>
            <span id="ai-spinner-${idx}" class="animate-spin h-3.5 w-3.5 text-blue-400 hidden">
              <svg class="h-full w-full" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
            </span>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-left">
            <div>
              <label class="text-[10px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">곡 제목 (Title)</label>
              <input type="text" id="edit-title-${idx}" value="${track.title}" class="w-full vision-control rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-white/40">
            </div>
            <div>
              <label class="text-[10px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">아티스트 (Artist)</label>
              <input type="text" id="edit-artist-${idx}" value="${track.artist || ''}" class="w-full vision-control rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-white/40">
            </div>
            <div>
              <label class="text-[10px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">BPM (Tempo)</label>
              <input type="number" step="0.1" id="edit-bpm-${idx}" value="${track.bpm}" class="w-full vision-control rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-white/40">
            </div>
            <div>
              <label class="text-[10px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">조성 (Key)</label>
              <input type="text" id="edit-key-${idx}" value="${track.key}" class="w-full vision-control rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-white/40">
            </div>
          </div>

          <div class="bg-black/40 p-3 rounded-xl border border-white/10 text-left">
            <span class="text-[10px] font-bold text-neutral-400 block mb-0.5">저장될 파일명 미리보기:</span>
            <span id="preview-filename-${idx}" class="text-xs font-mono text-emerald-400 font-semibold break-all">
              ${track.file_name}
            </span>
          </div>

          <div class="flex flex-wrap items-center justify-end gap-2 pt-1">
            <button type="button" id="btn-reanalyze-${idx}" class="vision-control hover:bg-white/15 px-3 py-2 rounded-xl text-xs font-medium text-white/80">
              다시 분석
            </button>
            <button type="button" id="btn-cancel-ai-${idx}" class="vision-control hover:bg-white/15 px-3 py-2 rounded-xl text-xs font-medium text-neutral-400">
              취소
            </button>
            <a
              id="btn-apply-filename-${idx}"
              href="${track.download_url}"
              download="${track.file_name}"
              class="bg-emerald-500 hover:bg-emerald-600 px-4 py-2 rounded-xl text-xs font-bold text-white shadow-lg shadow-emerald-500/25 apple-spring flex items-center space-x-1"
            >
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M5 13l4 4L19 7"/></svg>
              <span>파일명 적용 및 다운로드</span>
            </a>
          </div>
        </div>

        <!-- Custom Rename Dialog -->
        <div id="custom-panel-${idx}" class="hidden vision-control rounded-2xl p-5 border border-white/20 space-y-3 apple-spring text-left">
          <h4 class="text-xs font-bold text-white">다른 이름으로 저장</h4>
          <div>
            <label class="text-[10px] font-bold text-neutral-400 block mb-1">희망하는 파일명을 입력하세요:</label>
            <div class="flex items-center space-x-2">
              <input type="text" id="custom-input-${idx}" value="${track.file_name.replace('.' + track.format, '')}" class="flex-1 vision-control rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-white/40 font-mono">
              <span class="text-xs text-neutral-400 font-mono">.${track.format}</span>
            </div>
          </div>
          <div class="flex items-center justify-end space-x-2 pt-1">
            <button type="button" id="btn-cancel-custom-${idx}" class="vision-control hover:bg-white/15 px-3 py-1.5 rounded-xl text-xs text-neutral-400">
              취소
            </button>
            <a
              id="btn-apply-custom-${idx}"
              href="${track.download_url}"
              download="${track.file_name}"
              class="bg-[#0A84FF] hover:bg-[#0071E3] px-4 py-1.5 rounded-xl text-xs font-bold text-white shadow-md apple-spring"
            >
              저장
            </a>
          </div>
        </div>
      `;

      resultsContainer.appendChild(card);
      bindTrackCardEvents(track, idx);
    }

    function bindTrackCardEvents(track, idx) {
      const optBBtn = document.getElementById(`opt-b-btn-${idx}`);
      const optCBtn = document.getElementById(`opt-c-btn-${idx}`);
      const aiPanel = document.getElementById(`ai-panel-${idx}`);
      const customPanel = document.getElementById(`custom-panel-${idx}`);
      const aiSpinner = document.getElementById(`ai-spinner-${idx}`);

      const editTitle = document.getElementById(`edit-title-${idx}`);
      const editArtist = document.getElementById(`edit-artist-${idx}`);
      const editBpm = document.getElementById(`edit-bpm-${idx}`);
      const editKey = document.getElementById(`edit-key-${idx}`);
      const previewFilename = document.getElementById(`preview-filename-${idx}`);
      const btnApplyFilename = document.getElementById(`btn-apply-filename-${idx}`);
      const btnReanalyze = document.getElementById(`btn-reanalyze-${idx}`);
      const btnCancelAi = document.getElementById(`btn-cancel-ai-${idx}`);

      const customInput = document.getElementById(`custom-input-${idx}`);
      const btnCancelCustom = document.getElementById(`btn-cancel-custom-${idx}`);
      const btnApplyCustom = document.getElementById(`btn-apply-custom-${idx}`);
      const activeFilenameBadge = document.getElementById(`active-filename-badge-${idx}`);

      optBBtn.addEventListener('click', async () => {
        customPanel.classList.add('hidden');
        aiPanel.classList.remove('hidden');
        await triggerAIAnalysis(track, idx);
      });

      optCBtn.addEventListener('click', () => {
        aiPanel.classList.add('hidden');
        customPanel.classList.remove('hidden');
        customInput.focus();
      });

      btnCancelAi.addEventListener('click', () => aiPanel.classList.add('hidden'));
      btnCancelCustom.addEventListener('click', () => customPanel.classList.add('hidden'));

      const updatePreview = async () => {
        const titleVal = editTitle.value.trim();
        const artistVal = editArtist.value.trim();
        const bpmVal = parseFloat(editBpm.value) || null;
        const keyVal = editKey.value.trim();

        try {
          const res = await fetch('/api/format-filename', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              title: titleVal,
              artist: artistVal,
              bpm: bpmVal,
              key: keyVal,
              format: track.format
            })
          });
          const data = await res.json();
          if (data.success) {
            const newName = data.data.filename;
            previewFilename.textContent = newName;
            btnApplyFilename.download = newName;
            btnApplyFilename.href = `/api/download/${track.id}?format=${track.format}&filename=${encodeURIComponent(newName)}`;
          }
        } catch (_) {}
      };

      [editTitle, editArtist, editBpm, editKey].forEach(inp => {
        inp.addEventListener('input', updatePreview);
      });

      btnApplyFilename.addEventListener('click', async () => {
        const filenameToApply = previewFilename.textContent.trim();
        try {
          await fetch('/api/apply-filename', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              file_id: track.id,
              format: track.format,
              new_filename: filenameToApply
            })
          });
          activeFilenameBadge.textContent = filenameToApply;
          aiPanel.classList.add('hidden');
        } catch (_) {}
      });

      customInput.addEventListener('input', () => {
        const customName = `${customInput.value.trim()}.${track.format}`;
        btnApplyCustom.download = customName;
        btnApplyCustom.href = `/api/download/${track.id}?format=${track.format}&filename=${encodeURIComponent(customName)}`;
      });

      btnApplyCustom.addEventListener('click', () => {
        const customName = `${customInput.value.trim()}.${track.format}`;
        activeFilenameBadge.textContent = customName;
        customPanel.classList.add('hidden');
      });

      btnReanalyze.addEventListener('click', () => triggerAIAnalysis(track, idx));
    }

    async function triggerAIAnalysis(track, idx) {
      const aiSpinner = document.getElementById(`ai-spinner-${idx}`);
      const editTitle = document.getElementById(`edit-title-${idx}`);
      const editArtist = document.getElementById(`edit-artist-${idx}`);
      const editBpm = document.getElementById(`edit-bpm-${idx}`);
      const editKey = document.getElementById(`edit-key-${idx}`);
      const previewFilename = document.getElementById(`preview-filename-${idx}`);
      const btnApplyFilename = document.getElementById(`btn-apply-filename-${idx}`);

      aiSpinner.classList.remove('hidden');

      try {
        const res = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            file_id: track.id,
            format: track.format,
            raw_title: track.title,
            uploader: track.artist
          })
        });

        const data = await res.json();
        if (data.success) {
          const ai = data.data;
          editTitle.value = ai.title || track.title;
          editArtist.value = ai.artist || track.artist;
          editBpm.value = ai.bpm || track.bpm;
          editKey.value = ai.key || track.key;

          previewFilename.textContent = ai.suggested_filename;
          btnApplyFilename.download = ai.suggested_filename;
          btnApplyFilename.href = `/api/download/${track.id}?format=${track.format}&filename=${encodeURIComponent(ai.suggested_filename)}`;

          document.getElementById(`track-title-display-${idx}`).textContent = ai.title;
          document.getElementById(`track-artist-display-${idx}`).textContent = ai.artist;
          document.getElementById(`track-bpm-display-${idx}`).textContent = ai.bpm;
          document.getElementById(`track-key-display-${idx}`).textContent = translateKeyToKorean(ai.key);
        }
      } catch (err) {
        console.error('AI 분석 실패:', err);
      } finally {
        aiSpinner.classList.add('hidden');
      }
    }

    function showError(msg, steps) {
      stopTimer();
      errorTitle.textContent = "다운로드 / 분석 처리 중 문제 발생";
      errorMsg.textContent = msg;
      errorGuideList.innerHTML = '';
      if (steps && steps.length > 0) {
        steps.forEach(st => {
          const li = document.createElement('li');
          li.textContent = st;
          errorGuideList.appendChild(li);
        });
        errorGuideBox.classList.remove('hidden');
      } else {
        errorGuideBox.classList.add('hidden');
      }
      errorCard.classList.remove('hidden');
    }
  </script>
</body>
</html>
